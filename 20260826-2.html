<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3 欄式課程特色介紹</title>

    <style>
        /* ==================================================
           基礎樣式
           ================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;

            background-color: #f9fafb;
            color: #111827;
        }


        /* ==================================================
           HTML：課程特色區塊
           ================================================== */

        .course-section {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        .course-section__title {
            margin: 0 0 12px;
            text-align: center;
            font-size: 36px;
            line-height: 1.3;
        }

        .course-section__description {
            max-width: 680px;
            margin: 0 auto 48px;
            text-align: center;
            color: #4b5563;
            font-size: 17px;
            line-height: 1.8;
        }


        /* ==================================================
           CSS Grid：電腦版 3 欄
           ================================================== */

        .course-grid {
            display: grid;

            /* 電腦版平分成 3 欄 */
            grid-template-columns: repeat(3, 1fr);

            /* 欄位之間保持 24px 間距 */
            gap: 24px;
        }


        /* ==================================================
           課程特色卡片
           ================================================== */

        .course-card {
            padding: 32px 28px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;

            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .course-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.08);
        }


        /* ==================================================
           卡片圖示
           ================================================== */

        .course-card__icon {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 56px;
            height: 56px;
            margin-bottom: 24px;

            background-color: #fef3c7;
            border-radius: 12px;

            font-size: 26px;
        }


        /* ==================================================
           卡片標題
           ================================================== */

        .course-card__title {
            margin: 0 0 12px;

            font-size: 22px;
            line-height: 1.4;
        }


        /* ==================================================
           卡片內文
           ================================================== */

        .course-card__text {
            margin: 0;

            color: #4b5563;
            font-size: 16px;
            line-height: 1.8;
        }


        /* ==================================================
           手機版 RWD 安全機制
           
           當螢幕寬度小於 768px：
           3 欄 → 1 欄
           上下直排，避免手機畫面擠壓
           ================================================== */

        @media (max-width: 768px) {

            .course-grid {
                grid-template-columns: 1fr !important;
            }

            .course-section {
                padding: 56px 20px;
            }

            .course-section__title {
                font-size: 30px;
            }

            .course-section__description {
                margin-bottom: 32px;
                font-size: 16px;
            }

            .course-card {
                padding: 28px 24px;
            }
        }
    </style>
</head>

<body>

    <!-- ==================================================
         HTML：課程特色介紹區塊
         ================================================== -->

    <section class="course-section">

        <!-- 區塊標題 -->
        <h1 class="course-section__title">
            課程特色
        </h1>

        <!-- 區塊說明 -->
        <p class="course-section__description">
            從基礎觀念到實戰應用，透過系統化課程設計，
            幫助你建立完整的學習能力。
        </p>


        <!-- ==================================================
             3 欄式 Grid 容器
             ================================================== -->

        <div class="course-grid">


            <!-- ==================================================
                 課程特色卡片 1
                 ================================================== -->

            <article class="course-card">

                <div class="course-card__icon">
                    🎯
                </div>

                <h2 class="course-card__title">
                    系統化學習
                </h2>

                <p class="course-card__text">
                    將複雜的學習內容拆解成清楚的階段，
                    從基礎觀念開始逐步建立完整能力。
                </p>

            </article>


            <!-- ==================================================
                 課程特色卡片 2
                 ================================================== -->

            <article class="course-card">

                <div class="course-card__icon">
                    ⚡
                </div>

                <h2 class="course-card__title">
                    實戰訓練
                </h2>

                <p class="course-card__text">
                    結合實際案例與情境演練，
                    將課堂中學到的知識轉化成真正的實戰能力。
                </p>

            </article>


            <!-- ==================================================
                 課程特色卡片 3
                 ================================================== -->

            <article class="course-card">

                <div class="course-card__icon">
                    📈
                </div>

                <h2 class="course-card__title">
                    持續成長
                </h2>

                <p class="course-card__text">
                    透過階段性檢視與學習回饋，
                    找出目前問題並持續調整學習方向。
                </p>

            </article>


        </div>

    </section>

</body>
</html>
